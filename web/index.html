<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>MN Player</title><link rel="stylesheet" href="app.css?v=1.1.0"><script src="player.js?v=1.1.0" defer></script><script src="app.js?v=1.1.0" defer></script></head>
<body><main><mn-player id="player" hide-title></mn-player></main>
<nav class="tools" aria-label="Dosya işlemleri">
<button id="file-open" aria-label="Medya aç" title="Medya aç (⌘O)"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3z M3 7V4h7l2 3"/></svg></button>
<button id="url-open" aria-label="Bağlantı aç" title="Bağlantı aç (⌘L)"><svg viewBox="0 0 24 24"><path d="M10 13l4-4 M8 16l-1 1a4 4 0 01-6-6l4-4a4 4 0 016 0 M16 8l1-1a4 4 0 016 6l-4 4a4 4 0 01-6 0"/></svg></button>
<button id="caption-open" aria-label="Altyazı dosyası ekle" title="Altyazı ekle (⌘S)"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z M10 9H7v6h3 M18 9h-3v6h3"/></svg></button>
<button id="queue-toggle" aria-label="Oynatma listesi" title="Oynatma listesi" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16 M4 12h10 M4 18h10 M18 11l5 4-5 4z"/></svg></button>
<button id="shortcuts" aria-label="Klavye kısayolları" title="Klavye kısayolları"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z M6 10h1 M10 10h1 M14 10h1 M18 10h1 M7 14h10"/></svg></button>
<button id="embed-open" aria-label="Web entegrasyonu" title="Web entegrasyonu"><svg viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6 M16 6l6 6-6 6 M14 4l-4 16"/></svg></button>
</nav>
<aside id="queue" hidden><div class="queue-tools"><button id="autoplay" role="switch" aria-checked="false" aria-label="Otomatik sonraki video" title="Otomatik sonraki video">↻</button><button id="add" aria-label="Listeye medya ekle" title="Listeye medya ekle">＋</button><button id="queue-close" aria-label="Listeyi kapat" title="Listeyi kapat">×</button></div><div id="playlist"></div></aside>
<input id="files" type="file" accept="video/*,audio/*,.mkv,.mov,.mp4,.webm,.mp3,.m4a,.wav" multiple hidden><input id="captions" type="file" accept=".vtt,.srt" hidden>
<dialog id="url-dialog"><form id="url-form"><button type="button" data-close class="close" aria-label="Kapat">×</button><label for="url-input">Medya bağlantısı</label><input id="url-input" type="url" placeholder="https://site.com/video.mp4" required><button class="primary" type="submit">Aç</button></form></dialog>
<dialog id="embed-dialog"><button data-close class="close" aria-label="Kapat">×</button><pre id="embed-code"></pre><button id="copy-embed" class="primary">Kopyala</button></dialog>
<div id="toast" role="status"></div></body></html>
