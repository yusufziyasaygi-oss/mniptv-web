<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MN Player • Gömülü oynatıcı</title><script src="player.js?v=1.1.0" defer></script><style>html,body{margin:0;background:black;width:100%;height:100%}mn-player{width:100%;height:100%;aspect-ratio:auto}</style></head><body><mn-player hide-title></mn-player><script>window.addEventListener('DOMContentLoaded',()=>{const p=new URLSearchParams(location.search),player=document.querySelector('mn-player');const safe=(s)=>{if(!s)return '';const u=new URL(s,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';};try{const src=safe(p.get('src'));if(src)player.setMedia({src,poster:safe(p.get('poster')),title:p.get('title')||'Mavi Nokta Production'});}catch{player.showError('Geçerli bir medya bağlantısı gir.');}});</script></body></html>
