name: Recover MN IPTV latest sources

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mniptv-source-recovery-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Recover Android TV/parity source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 "https://drive.google.com/uc?export=download&id=1rdqfMPxTmjjXN77t_fFB0NKWHQWuTjqA" -o source.zip
          echo "3896726a298589ebe622b39886f020c1e47f816f0bf62030daafb578dc55499b  source.zip" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-RECOVERED-ANDROID-TV-PARITY-SOURCE
          path: source.zip
          if-no-files-found: error
          retention-days: 1

  android-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Recover Android phone v2.0.2 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 "https://drive.google.com/uc?export=download&id=1Lk18CwAG3bnjVYL7zlp1YLKbHAvUYo-G" -o source.zip
          echo "6210800bfd087da73c7fde45f664063e34eb4ad70c36303777825495494975e9  source.zip" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-RECOVERED-ANDROID-PHONE-v2.0.2-SOURCE
          path: source.zip
          if-no-files-found: error
          retention-days: 1

  ios:
    runs-on: ubuntu-latest
    steps:
      - name: Recover currently published iOS Xcode source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 "https://drive.google.com/uc?export=download&id=1SgM02_Sf7Q1-l7SDtTNJBR2SgY8uzJyW" -o source.zip
          sha256sum source.zip | tee source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-RECOVERED-IOS-PUBLISHED-SOURCE
          path: |
            source.zip
            source.sha256
          if-no-files-found: error
          retention-days: 1

  native-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Recover native baseline with Windows source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 "https://drive.google.com/uc?export=download&id=1sFb6fL1MGloMQaS-RlAkm_XQUoxjel1F" -o source.zip
          echo "a2437e344f184b4fe06556070f0334efba3c8232c491e8b62e1a67b5f89c8afc  source.zip" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-RECOVERED-NATIVE-BASELINE-SOURCE
          path: source.zip
          if-no-files-found: error
          retention-days: 1
