name: Build MN IPTV iOS 2.0.3 Stream Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mniptv-ios-2.0.3-stream-fix-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP_ID: 1z6Z8oGv2UQ3FZqXW-6jOciLSZvEoUyPY
  EXPECTED_SOURCE_SHA256: 7de6cee79516c98fed072f15566ce5af498f0d7451f48f1812722f280bb1cd4f
  EXPECTED_VERSION: 2.0.3
  EXPECTED_BUILD: '24'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Download and validate source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 --retry-all-errors "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o source.zip
          test "$(shasum -a 256 source.zip | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          unzip -q source.zip
          cd MN-IPTV-iOS
          grep -q 'Doğrudan oynatma deneniyor' App/MobilePlayer.swift
          grep -q 'http-continuous=true' App/MobilePlayer.swift
          ! grep -q 'bytes=0-2047' App/StreamProbe.swift
          grep -q "MARKETING_VERSION: '2.0.3'" project.yml
          grep -q "CURRENT_PROJECT_VERSION: '24'" project.yml
          swiftc -frontend -parse Shared/*.swift App/*.swift

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods

      - name: Generate workspace
        working-directory: MN-IPTV-iOS
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          pod install --repo-update

      - name: Build simulator
        working-directory: MN-IPTV-iOS
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-simulator
          xcodebuild -workspace MNIPTV.xcworkspace -scheme MNIPTV -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator MARKETING_VERSION="$EXPECTED_VERSION" CURRENT_PROJECT_VERSION="$EXPECTED_BUILD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP='build-simulator/Build/Products/Release-iphonesimulator/MNIPTV.app'
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$EXPECTED_BUILD"
          ditto -c -k --sequesterRsrc --keepParent "$APP" MN-IPTV-iOS-v2.0.3-STREAM-FIX-Simulator.app.zip

      - name: Build generic device app unsigned
        working-directory: MN-IPTV-iOS
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-device
          xcodebuild -workspace MNIPTV.xcworkspace -scheme MNIPTV -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device MARKETING_VERSION="$EXPECTED_VERSION" CURRENT_PROJECT_VERSION="$EXPECTED_BUILD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP='build-device/Build/Products/Release-iphoneos/MNIPTV.app'
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$EXPECTED_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.mavinokta.iptv.ios'
          mkdir -p unsigned/Payload
          ditto "$APP" unsigned/Payload/MNIPTV.app
          (cd unsigned && zip -qry ../MN-IPTV-iOS-v2.0.3-STREAM-FIX-UNSIGNED.ipa Payload)
          ditto -c -k --sequesterRsrc --keepParent "$APP" MN-IPTV-iOS-v2.0.3-STREAM-FIX-UNSIGNED.app.zip
          shasum -a 256 MN-IPTV-iOS-v2.0.3-STREAM-FIX-UNSIGNED.ipa MN-IPTV-iOS-v2.0.3-STREAM-FIX-UNSIGNED.app.zip MN-IPTV-iOS-v2.0.3-STREAM-FIX-Simulator.app.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-iOS-v2.0.3-STREAM-FIX-COMPILED-UNSIGNED
          path: |
            MN-IPTV-iOS/MN-IPTV-iOS-v2.0.3-STREAM-FIX-UNSIGNED.ipa
            MN-IPTV-iOS/MN-IPTV-iOS-v2.0.3-STREAM-FIX-UNSIGNED.app.zip
            MN-IPTV-iOS/MN-IPTV-iOS-v2.0.3-STREAM-FIX-Simulator.app.zip
            MN-IPTV-iOS/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
