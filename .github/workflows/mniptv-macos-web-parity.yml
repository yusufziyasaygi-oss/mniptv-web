name: Build MN IPTV macOS Web Parity

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mniptv-macos-web-parity.yml'

concurrency:
  group: mniptv-macos-web-parity
  cancel-in-progress: true

env:
  # Stable Drive object. Its bytes can be replaced in-place without changing this workflow.
  SOURCE_ZIP_ID: 1c9rDVm-2e8lp-81epimIDWIMcqwLq9rw

jobs:
  arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Download latest native source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o source.zip
          shasum -a 256 source.zip | tee source-sha256.txt
          unzip -q source.zip
          test -f 'MN-IPTV/Info.plist'
          test -f 'MN-IPTV/scripts/build.sh'
          test -d 'MN-IPTV/Sources'
          ! grep -R -E 'WKWebView|WebView' MN-IPTV/Sources MN-IPTV/Native
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'MN-IPTV/Info.plist' | tee source-version.txt
          swiftc -frontend -parse MN-IPTV/Sources/*.swift

      - name: Install native libmpv
        run: brew install mpv

      - name: Build and verify arm64 app
        working-directory: MN-IPTV
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 https://curl.se/ca/cacert.pem -o "$RUNNER_TEMP/cacert.pem"
          MAVI_CA_FILE="$RUNNER_TEMP/cacert.pem" bash scripts/build.sh
          APP='build/MN IPTV.app'
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/MaviNoktaIPTV"
          lipo -archs "$APP/Contents/MacOS/MaviNoktaIPTV" | grep -q arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" > build/app-version.txt
          tar -czf build/MN-IPTV-arm64.app.tgz -C build 'MN IPTV.app'
          cp ../source-sha256.txt build/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-macOS-Web-Parity-arm64
          path: |
            MN-IPTV/build/MN-IPTV-arm64.app.tgz
            MN-IPTV/build/app-version.txt
            MN-IPTV/build/source-sha256.txt
          if-no-files-found: error
          retention-days: 7

  intel:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Download latest native source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o source.zip
          shasum -a 256 source.zip | tee source-sha256.txt
          unzip -q source.zip
          test -f 'MN-IPTV/Info.plist'
          test -f 'MN-IPTV/scripts/build.sh'
          test -d 'MN-IPTV/Sources'
          ! grep -R -E 'WKWebView|WebView' MN-IPTV/Sources MN-IPTV/Native
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'MN-IPTV/Info.plist' | tee source-version.txt
          swiftc -frontend -parse MN-IPTV/Sources/*.swift

      - name: Install native libmpv
        run: brew install mpv

      - name: Build and verify x86_64 app
        working-directory: MN-IPTV
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 https://curl.se/ca/cacert.pem -o "$RUNNER_TEMP/cacert.pem"
          MAVI_CA_FILE="$RUNNER_TEMP/cacert.pem" bash scripts/build.sh
          APP='build/MN IPTV.app'
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/MaviNoktaIPTV"
          lipo -archs "$APP/Contents/MacOS/MaviNoktaIPTV" | grep -q x86_64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" > build/app-version.txt
          tar -czf build/MN-IPTV-intel.app.tgz -C build 'MN IPTV.app'
          cp ../source-sha256.txt build/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-macOS-Web-Parity-intel
          path: |
            MN-IPTV/build/MN-IPTV-intel.app.tgz
            MN-IPTV/build/app-version.txt
            MN-IPTV/build/source-sha256.txt
          if-no-files-found: error
          retention-days: 7

  universal:
    name: macOS Universal Web-Parity DMG
    needs: [arm64, intel]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MN-IPTV-macOS-Web-Parity-arm64
          path: arm-artifact
      - uses: actions/download-artifact@v4
        with:
          name: MN-IPTV-macOS-Web-Parity-intel
          path: intel-artifact

      - name: Verify both architectures used identical source
        shell: bash
        run: |
          set -euxo pipefail
          cmp arm-artifact/source-sha256.txt intel-artifact/source-sha256.txt
          cmp arm-artifact/app-version.txt intel-artifact/app-version.txt
          cp arm-artifact/source-sha256.txt SOURCE-SHA256.txt
          cp arm-artifact/app-version.txt APP-VERSION.txt

      - name: Merge native apps into Universal 2 and make DMG
        shell: bash
        run: |
          set -euxo pipefail
          mkdir arm intel universal stage
          tar -xzf arm-artifact/MN-IPTV-arm64.app.tgz -C arm
          tar -xzf intel-artifact/MN-IPTV-intel.app.tgz -C intel
          ditto 'arm/MN IPTV.app' 'universal/MN IPTV.app'
          ARM='arm/MN IPTV.app'
          INTEL='intel/MN IPTV.app'
          OUT='universal/MN IPTV.app'

          find "$ARM/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            rel="${f#$ARM/}"
            other="$INTEL/$rel"
            out="$OUT/$rel"
            if file "$f" | grep -q 'Mach-O'; then
              if [ -f "$other" ] && file "$other" | grep -q 'Mach-O'; then
                tmp="$RUNNER_TEMP/$(basename "$rel").universal.$$"
                lipo -create "$f" "$other" -output "$tmp"
                mv "$tmp" "$out"
                chmod +x "$out" || true
              else
                echo "Deferred versioned Mach-O alias: $rel"
              fi
            fi
          done

          merge_versioned_alias_pair() {
            pattern="$1"
            arm_file="$(find "$ARM/Contents/Frameworks" -maxdepth 1 -type f -name "$pattern" | head -n 1)"
            intel_file="$(find "$INTEL/Contents/Frameworks" -maxdepth 1 -type f -name "$pattern" | head -n 1)"
            test -n "$arm_file"; test -n "$intel_file"
            arm_base="$(basename "$arm_file")"; intel_base="$(basename "$intel_file")"
            if [ "$arm_base" != "$intel_base" ]; then
              tmp="$RUNNER_TEMP/${arm_base}.alias-universal.$$"
              lipo -create "$arm_file" "$intel_file" -output "$tmp"
              cp "$tmp" "$OUT/Contents/Frameworks/$arm_base"
              cp "$tmp" "$OUT/Contents/Frameworks/$intel_base"
              chmod +x "$OUT/Contents/Frameworks/$arm_base" "$OUT/Contents/Frameworks/$intel_base" || true
            fi
          }
          merge_versioned_alias_pair 'libx265.*.dylib'
          merge_versioned_alias_pair 'libluajit-5.1.*.dylib'

          for f in "$INTEL/Contents/Frameworks"/*; do test -e "$OUT/Contents/Frameworks/$(basename "$f")"; done
          find "$OUT/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              archs="$(lipo -archs "$f")"
              echo "${f#$OUT/} => $archs"
              echo "$archs" | grep -q arm64
              echo "$archs" | grep -q x86_64
            fi
          done

          find "$OUT/Contents/Frameworks" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then codesign --force --sign - "$f"; fi
          done
          codesign --force --deep --sign - "$OUT"
          codesign --verify --deep --strict "$OUT"
          lipo -archs "$OUT/Contents/MacOS/MaviNoktaIPTV" | tee universal-archs.txt
          grep -q arm64 universal-archs.txt
          grep -q x86_64 universal-archs.txt
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$OUT/Contents/Info.plist")"
          EXPECTED_VERSION="$(cat APP-VERSION.txt)"
          test "$BUNDLE_VERSION" = "$EXPECTED_VERSION"

          ditto "$OUT" 'stage/MN IPTV.app'
          ln -s /Applications stage/Applications
          hdiutil create -volname 'MN IPTV' -srcfolder stage -format UDZO -ov MN-IPTV-macOS.dmg
          hdiutil verify MN-IPTV-macOS.dmg
          shasum -a 256 MN-IPTV-macOS.dmg > MN-IPTV-macOS.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-macOS-Web-Parity-Universal
          path: |
            MN-IPTV-macOS.dmg
            MN-IPTV-macOS.dmg.sha256
            universal-archs.txt
            APP-VERSION.txt
            SOURCE-SHA256.txt
          if-no-files-found: error
          retention-days: 7
