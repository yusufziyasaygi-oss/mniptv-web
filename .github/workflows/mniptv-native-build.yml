name: Build REAL MN IPTV Native Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mniptv-native-build.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP_ID: 12MhwnZZN3HDgZDVA9N5Noc4TSlblu2BW
  SOURCE_ZIP_SHA256: 351b8ebdb6e8e2cfef3134b7a819f1a8b73311b99343a8b586923733dba6735b

jobs:
  android:
    name: Android TV + Android phone
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download verified MN IPTV native sources
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o native.zip
          echo "${SOURCE_ZIP_SHA256}  native.zip" | sha256sum -c -
          unzip -q native.zip
          grep -R '^package com.mavinokta.mniptv' native_ci_inputs/android/common-src/com/mavinokta/mniptv/*.kt >/dev/null
          ! grep -R -E 'io\.github\.jqssun\.airplay|com\.mavinokta\.mncast' native_ci_inputs/android/common-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android platform/build tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build release APKs from MN IPTV Kotlin source
        working-directory: native_ci_inputs/android
        shell: bash
        run: |
          set -euxo pipefail
          gradle :tv:assembleRelease :mobile:assembleRelease --no-daemon --stacktrace --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
          mkdir -p ../../android-out/signing-tools/lib
          cp tv/build/outputs/apk/release/tv-release-unsigned.apk ../../android-out/MN-IPTV-TV-unsigned.apk
          cp mobile/build/outputs/apk/release/mobile-release-unsigned.apk ../../android-out/MN-IPTV-Android-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" ../../android-out/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ../../android-out/signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" ../../android-out/signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" ../../android-out/signing-tools/
          chmod +x ../../android-out/signing-tools/apksigner ../../android-out/signing-tools/zipalign ../../android-out/signing-tools/aapt

      - name: Prove both APKs are MN IPTV, not MN Cast/AirPlay
        shell: bash
        run: |
          set -euxo pipefail
          for apk in android-out/MN-IPTV-*-unsigned.apk; do
            android-out/signing-tools/aapt dump badging "$apk" | tee "$apk.badging.txt"
            grep -q "package: name='com.mavinokta.mniptv'" "$apk.badging.txt"
            unzip -p "$apk" 'classes*.dex' | strings > "$apk.dexstrings.txt"
            grep -q 'com/mavinokta/mniptv' "$apk.dexstrings.txt"
            ! grep -Eq 'io/github/jqssun/airplay|com/mavinokta/mncast' "$apk.dexstrings.txt"
          done
          sha256sum android-out/*.apk > android-out/SHA256SUMS-UNSIGNED.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-Android-UNSIGNED
          path: |
            android-out/MN-IPTV-TV-unsigned.apk
            android-out/MN-IPTV-TV-unsigned.apk.badging.txt
            android-out/MN-IPTV-Android-unsigned.apk
            android-out/MN-IPTV-Android-unsigned.apk.badging.txt
            android-out/SHA256SUMS-UNSIGNED.txt
            android-out/signing-tools/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified MN IPTV native sources
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o native.zip
          echo "${SOURCE_ZIP_SHA256}  native.zip" | sha256sum -c -
          unzip -q native.zip
          grep -q 'appName    = "MN IPTV"' native_ci_inputs/windows/main.go

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build real Win32 MN IPTV app
        working-directory: native_ci_inputs/windows
        shell: bash
        run: |
          set -euxo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../../MN-IPTV-Windows.exe .
          file ../../MN-IPTV-Windows.exe
          strings ../../MN-IPTV-Windows.exe | grep -q 'MN IPTV'
          strings ../../MN-IPTV-Windows.exe | grep -q 'player_api.php'
          sha256sum ../../MN-IPTV-Windows.exe > ../../MN-IPTV-Windows.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-Windows
          path: |
            MN-IPTV-Windows.exe
            MN-IPTV-Windows.exe.sha256
          if-no-files-found: error
          retention-days: 7

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Download verified MN IPTV native sources
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o native.zip
          echo "${SOURCE_ZIP_SHA256}  native.zip" | shasum -a 256 -c -
          unzip -q native.zip
          grep -q 'com.mavinokta.iptv' native_ci_inputs/macos/Info.plist
          grep -q '1.3.1' native_ci_inputs/macos/Info.plist
          ! grep -R -E 'WKWebView|WebView' native_ci_inputs/macos/Sources native_ci_inputs/macos/Native

      - name: Install libmpv build dependency
        run: brew install mpv

      - name: Build real Swift/AppKit/libmpv app
        working-directory: native_ci_inputs/macos
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 https://curl.se/ca/cacert.pem -o "$RUNNER_TEMP/cacert.pem"
          MAVI_CA_FILE="$RUNNER_TEMP/cacert.pem" bash scripts/build.sh
          codesign --verify --deep --strict 'build/MN IPTV.app'
          file 'build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV'
          lipo -archs 'build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV' | grep -q arm64
          bash scripts/create-dmg.sh
          cp build/MN-IPTV.dmg build/MN-IPTV-Apple-Silicon.dmg
          shasum -a 256 build/MN-IPTV-Apple-Silicon.dmg > build/MN-IPTV-Apple-Silicon.dmg.sha256
          tar -czf build/MN-IPTV-Apple-Silicon.app.tgz -C build 'MN IPTV.app'

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-macOS-Apple-Silicon
          path: |
            native_ci_inputs/macos/build/MN-IPTV-Apple-Silicon.dmg
            native_ci_inputs/macos/build/MN-IPTV-Apple-Silicon.dmg.sha256
            native_ci_inputs/macos/build/MN-IPTV-Apple-Silicon.app.tgz
          if-no-files-found: error
          retention-days: 7

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Download verified MN IPTV native sources
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 "https://drive.google.com/uc?export=download&id=${SOURCE_ZIP_ID}" -o native.zip
          echo "${SOURCE_ZIP_SHA256}  native.zip" | shasum -a 256 -c -
          unzip -q native.zip
          grep -q 'com.mavinokta.iptv' native_ci_inputs/macos/Info.plist
          grep -q '1.3.1' native_ci_inputs/macos/Info.plist
          ! grep -R -E 'WKWebView|WebView' native_ci_inputs/macos/Sources native_ci_inputs/macos/Native

      - name: Install libmpv build dependency
        run: brew install mpv

      - name: Build real Swift/AppKit/libmpv app
        working-directory: native_ci_inputs/macos
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 https://curl.se/ca/cacert.pem -o "$RUNNER_TEMP/cacert.pem"
          MAVI_CA_FILE="$RUNNER_TEMP/cacert.pem" bash scripts/build.sh
          codesign --verify --deep --strict 'build/MN IPTV.app'
          file 'build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV'
          lipo -archs 'build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV' | grep -q x86_64
          bash scripts/create-dmg.sh
          cp build/MN-IPTV.dmg build/MN-IPTV-Intel.dmg
          shasum -a 256 build/MN-IPTV-Intel.dmg > build/MN-IPTV-Intel.dmg.sha256
          tar -czf build/MN-IPTV-Intel.app.tgz -C build 'MN IPTV.app'

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-macOS-Intel
          path: |
            native_ci_inputs/macos/build/MN-IPTV-Intel.dmg
            native_ci_inputs/macos/build/MN-IPTV-Intel.dmg.sha256
            native_ci_inputs/macos/build/MN-IPTV-Intel.app.tgz
          if-no-files-found: error
          retention-days: 7

  mac-universal:
    name: macOS Universal DMG
    needs: [mac-arm64, mac-intel]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MN-IPTV-macOS-Apple-Silicon
          path: arm-artifact
      - uses: actions/download-artifact@v4
        with:
          name: MN-IPTV-macOS-Intel
          path: intel-artifact

      - name: Merge both real native apps into one Universal 2 app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir arm intel universal stage
          tar -xzf arm-artifact/MN-IPTV-Apple-Silicon.app.tgz -C arm
          tar -xzf intel-artifact/MN-IPTV-Intel.app.tgz -C intel
          ditto 'arm/MN IPTV.app' 'universal/MN IPTV.app'
          ARM='arm/MN IPTV.app'
          INTEL='intel/MN IPTV.app'
          OUT='universal/MN IPTV.app'

          find "$ARM/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            rel="${f#$ARM/}"
            other="$INTEL/$rel"
            out="$OUT/$rel"
            if file "$f" | grep -q 'Mach-O'; then
              test -f "$other"
              file "$other" | grep -q 'Mach-O'
              tmp="$RUNNER_TEMP/$(basename "$rel").universal.$$"
              lipo -create "$f" "$other" -output "$tmp"
              mv "$tmp" "$out"
              chmod +x "$out" || true
              archs="$(lipo -archs "$out")"
              echo "$rel => $archs"
              echo "$archs" | grep -q arm64
              echo "$archs" | grep -q x86_64
            fi
          done

          (cd "$ARM/Contents/Frameworks" && find . -type f | sort) > arm.frameworks
          (cd "$INTEL/Contents/Frameworks" && find . -type f | sort) > intel.frameworks
          diff -u arm.frameworks intel.frameworks

          find "$OUT/Contents/Frameworks" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then codesign --force --sign - "$f"; fi
          done
          codesign --force --deep --sign - "$OUT"
          codesign --verify --deep --strict "$OUT"
          lipo -archs "$OUT/Contents/MacOS/MaviNoktaIPTV" | tee universal-archs.txt
          grep -q arm64 universal-archs.txt
          grep -q x86_64 universal-archs.txt

          ditto "$OUT" 'stage/MN IPTV.app'
          ln -s /Applications stage/Applications
          hdiutil create -volname 'MN IPTV' -srcfolder stage -format UDZO -ov MN-IPTV-macOS.dmg
          hdiutil verify MN-IPTV-macOS.dmg
          shasum -a 256 MN-IPTV-macOS.dmg > MN-IPTV-macOS.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-macOS-Universal
          path: |
            MN-IPTV-macOS.dmg
            MN-IPTV-macOS.dmg.sha256
            universal-archs.txt
          if-no-files-found: error
          retention-days: 7
