name: Export current MN IPTV web

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mniptv-web-export-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current web app
        shell: bash
        run: |
          set -euxo pipefail
          test -f iptv/index.html
          test -f iptv/assets/app-drive.js
          zip -qry MN-IPTV-Web-LATEST.zip iptv
          sha256sum MN-IPTV-Web-LATEST.zip > MN-IPTV-Web-LATEST.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MN-IPTV-WEB-CURRENT
          path: |
            MN-IPTV-Web-LATEST.zip
            MN-IPTV-Web-LATEST.zip.sha256
          if-no-files-found: error
          retention-days: 1
