name: Build MN IPTV Mac

on:
  push:
    branches: [ mn-iptv-mac ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-iptv-mac
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          bash scripts/build.sh 2>&1 | tee out/build.log

      - name: Smoke test against mock Xtream server
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p ci/media out/smoke
          exec > >(tee out/smoke/step.log) 2>&1
          set -x
          FF="$(command -v ffmpeg)"
          [ -z "$FF" ] && [ -x "$(brew --prefix ffmpeg 2>/dev/null)/bin/ffmpeg" ] && FF="$(brew --prefix ffmpeg)/bin/ffmpeg"
          [ -z "$FF" ] && { brew install ffmpeg; FF="$(command -v ffmpeg)"; }
          echo "ffmpeg=$FF"
          "$FF" -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 40 -c:v libx264 -preset veryfast -pix_fmt yuv420p -g 25 -c:a aac -b:a 128k -f mpegts ci/media/live.ts
          "$FF" -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=330:sample_rate=48000 -t 60 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart ci/media/movie.mp4
          "$FF" -loglevel error -y -f lavfi -i color=c=0x3B8BFF:s=128x128 -frames:v 1 ci/media/logo.png
          "$FF" -loglevel error -y -f lavfi -i color=c=0x246AD6:s=300x450 -frames:v 1 ci/media/poster.png
          ls -la ci/media
          MOCK_HOST=http://127.0.0.1:8080 python3 ci/mock_xtream.py > out/smoke/server.log 2>&1 &
          sleep 2
          curl -s "http://127.0.0.1:8080/player_api.php?username=u&password=p" > out/smoke/server_check.txt
          MN_SMOKE_DIR="$PWD/out/smoke" MN_SMOKE_SERVER="http://127.0.0.1:8080" \
            "build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV" > out/smoke/app-stdout.txt 2>&1 &
          APP_PID=$!
          for i in $(seq 1 360); do
            [ -f out/smoke/finished.txt ] && break
            kill -0 $APP_PID 2>/dev/null || { echo "APP EXITED EARLY" >> out/smoke/app-stdout.txt; break; }
            sleep 1
          done
          sleep 2
          kill $APP_PID 2>/dev/null
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null > out/smoke/diagnostic-list.txt
          for f in ~/Library/Logs/DiagnosticReports/*MaviNokta*; do [ -f "$f" ] && cp "$f" out/smoke/; done
          cat out/smoke/finished.txt || echo "NOT FINISHED"
          # Repeat run to check that rendering is consistent, not lucky.
          mkdir -p out/smoke2
          MN_SMOKE_DIR="$PWD/out/smoke2" MN_SMOKE_SERVER="http://127.0.0.1:8080" \
            "build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV" > out/smoke2/app-stdout.txt 2>&1 &
          APP_PID=$!
          for i in $(seq 1 360); do
            [ -f out/smoke2/finished.txt ] && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done
          sleep 2
          kill $APP_PID 2>/dev/null
          exit 0

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          echo "${{ steps.build.outcome }}" > out/status.txt
          echo "${{ steps.smoke.outcome }}" > out/smoke-status.txt
          echo "${GITHUB_SHA}" > out/source_sha.txt
          grep -nE "error:|warning: unre|FAILED|Error" out/build.log | head -200 > out/errors.txt || true
          if [ -f build/MN-IPTV-Mac.dmg ]; then
            cp build/MN-IPTV-Mac.dmg out/
            cp build/minimum-macos.txt out/
            shasum -a 256 out/MN-IPTV-Mac.dmg > out/SHA256.txt
            lipo -archs "build/MN IPTV.app/Contents/MacOS/MaviNoktaIPTV" > out/archs.txt
            ls "build/MN IPTV.app/Contents/Frameworks" | wc -l > out/frameworks-count.txt
          fi

      - name: Publish outputs to branch
        if: always()
        shell: bash
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b mn-iptv-mac-out
          git add -A
          git commit -q -m "Build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mn-iptv-mac-out
