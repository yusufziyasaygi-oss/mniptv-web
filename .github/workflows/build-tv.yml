name: Build MN IPTV TV

on:
  push:
    branches: [ mn-iptv-tv ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-iptv-tv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Prepare smoke-test media
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p ci/media
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 40 -c:v libx264 -preset veryfast -pix_fmt yuv420p -g 25 -c:a aac -b:a 128k -f mpegts ci/media/live.ts
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=330:sample_rate=48000 -t 60 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart ci/media/movie.mp4
          ffmpeg -loglevel error -y -f lavfi -i color=c=0x3B8BFF:s=128x128 -frames:v 1 ci/media/logo.png
          ffmpeg -loglevel error -y -f lavfi -i color=c=0x246AD6:s=300x450 -frames:v 1 ci/media/poster.png
          ls -la ci/media

      - name: Enable KVM
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android TV emulator
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash ci/smoke.sh

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          grep -nE '^e: |error:|FAILURE|What went wrong|Could not|AAPT' -A4 build.log > out/errors.txt 2>/dev/null || true
          echo "${{ steps.build.outcome }}" > out/status.txt
          echo "${GITHUB_SHA}" > out/source_sha.txt
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$APK" ]; then
            BT="$ANDROID_HOME/build-tools/35.0.0"
            cp "$APK" out/MN-IPTV-TV-unsigned.apk
            "$BT/aapt" dump badging out/MN-IPTV-TV-unsigned.apk > out/badging.txt 2>&1 || true
            "$BT/zipalign" -c -P 16 -v 4 out/MN-IPTV-TV-unsigned.apk > out/zipalign.txt 2>&1 && echo OK >> out/zipalign.txt || echo FAILED >> out/zipalign.txt
            mkdir -p out/tools
            cp "$BT/lib/apksigner.jar" out/tools/apksigner.jar
            sha256sum out/MN-IPTV-TV-unsigned.apk > out/SHA256.txt
          fi
          if [ -d smoke ]; then
            rm -f smoke/ci.jks smoke/test.apk
            cp -r smoke out/smoke
          fi

      - name: Publish outputs to branch
        if: always()
        shell: bash
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b mn-iptv-tv-out
          git add -A
          git commit -q -m "Build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mn-iptv-tv-out
