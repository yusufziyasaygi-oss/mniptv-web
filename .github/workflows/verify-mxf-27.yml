name: Locate MXF thumbnail failure on macOS 27
on:
  push:
    branches: [test/mxf-macos27]
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read macOS version and fetch released app
        run: |
          sw_vers
          curl -fsSL --retry 2 --max-time 100 https://raw.githubusercontent.com/yusufziyasaygi-oss/mniptv-web/b07beb5ad2306addff068d8348dacf4b1a65425d/MN-Player-2.2.6-macOS.zip -o "$RUNNER_TEMP/player.zip"
          echo "2b1ace3e0f47f2a1bfc4486c84967220280d7c0475f101469867cd8038731743  $RUNNER_TEMP/player.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/player.zip" /Applications
      - name: Register and enable shipped extension
        run: |
          app='/Applications/MN Player.app'
          codesign --verify --deep --strict "$app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          pluginkit -a "$app/Contents/PlugIns/MXFFirstFrame.appex"
          pluginkit -e use -i com.mavinokta.player.mxf-thumbnail
          pluginkit -mAvv -i com.mavinokta.player.mxf-thumbnail
      - name: Prepare generated AVC 4K test footage
        run: |
          echo '' | base64 -D | gzip -dc > "$RUNNER_TEMP/camera.MXF"
          swiftc tests/mxf-thumbnail.swift -o "$RUNNER_TEMP/check"
      - name: Ask Quick Look for the first frame
        run: '"$RUNNER_TEMP/check" "$RUNNER_TEMP/camera.MXF" red'
      - name: Check extension invocation
        if: always()
        run: |
          /usr/bin/log show --last 2m --style compact --info --predicate 'process == "MXFFirstFrame" OR eventMessage CONTAINS[c] "com.mavinokta.player.mxf-thumbnail" OR eventMessage CONTAINS[c] "MXFFirstFrame"' | tail -90
